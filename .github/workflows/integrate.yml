name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/stub-package-workflows/.github/workflows/stub-test.yml@master
    with:
      # Minimal repo: no phpunit/phpcs suite; php -l + clean-tree checks suffice
      test_command: ''
      stub_file: edd-all-access-stubs.php
